  #vignette {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse 75% 70% at 50% 42%, rgba(0,0,0,0) 40%, rgba(0,0,0,.72) 100%);
  }

  /* design canvas 1440 x 1000, scaled to fit any screen */
  #stage { position: fixed; left: 0; top: 0; width: 1440px; height: 1000px; transform-origin: 0 0; }
  .abs { position: absolute; }
  .ui { opacity: 0; transform: translateY(12px); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
  body.ready .ui { opacity: 1; transform: none; }
  .mono { font-family: var(--mono); font-size: 13px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase; }

  /* moving light, only really visible through the glass */
  .light { position: absolute; border-radius: 50%; filter: blur(55px); opacity: 0; transition: opacity 3s ease 1s; pointer-events: none; }
  body.ready .light { opacity: 1; }
  #l1 { left: 420px; top: 600px; width: 260px; height: 260px; background: rgba(40,130,255,.42); animation: o1 12s ease-in-out infinite alternate; }
  #l2 { left: 720px; top: 480px; width: 220px; height: 220px; background: rgba(90,80,255,.32); animation: o2 14s ease-in-out infinite alternate; }
  #l3 { left: 650px; top: 780px; width: 240px; height: 180px; background: rgba(40,220,170,.22); animation: o3 10s ease-in-out infinite alternate; }
  #l4 { left: 1120px; top: 180px; width: 260px; height: 220px; background: rgba(53,240,138,.14); animation: o2 13s ease-in-out infinite alternate-reverse; }
  #l5 { left: 560px; top: 200px; width: 320px; height: 150px; background: rgba(120,255,170,.10); animation: o1 9s ease-in-out infinite alternate-reverse; }
  @keyframes o1 { to { transform: translate(170px, 120px) scale(1.15); } }
  @keyframes o2 { to { transform: translate(-170px, 180px) scale(.9); } }
  @keyframes o3 { to { transform: translate(110px, -220px) scale(1.1); } }

  /* glass */
  .glass {
    background: linear-gradient(155deg, rgba(255,255,255,.10), rgba(255,255,255,.025) 42%, rgba(255,255,255,.05));
    -webkit-backdrop-filter: blur(26px) saturate(160%);
            backdrop-filter: blur(26px) saturate(160%);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 24px 50px rgba(0,0,0,.5);
  }
  .sheen { overflow: hidden; }
  .sheen::after {
    content: ""; position: absolute; inset: -40%; pointer-events: none;
    background: linear-gradient(105deg, transparent 44%, rgba(255,255,255,.10) 50%, transparent 56%);
    transform: translateX(-75%); animation: sheen 8s ease-in-out infinite; animation-delay: var(--sd, 0s);
  }
  @keyframes sheen { 0%, 72% { transform: translateX(-75%); } 100% { transform: translateX(75%); } }

  /* HUD corner brackets */
  .brackets { position: absolute; inset: 0; pointer-events: none; }
  .brackets i { position: absolute; width: 18px; height: 18px; border: 0 solid rgba(160,200,255,.55); }
  .brackets i:nth-child(1) { left: 0; top: 0; border-left-width: 1.5px; border-top-width: 1.5px; }
  .brackets i:nth-child(2) { right: 0; top: 0; border-right-width: 1.5px; border-top-width: 1.5px; }
  .brackets i:nth-child(3) { left: 0; bottom: 0; border-left-width: 1.5px; border-bottom-width: 1.5px; }
  .brackets i:nth-child(4) { right: 0; bottom: 0; border-right-width: 1.5px; border-bottom-width: 1.5px; }

  /* ---------- title block ---------- */
  #sign {
    left: 50px; top: 46px; width: 104px; opacity: 0;
    filter: drop-shadow(0 0 18px rgba(255,210,60,.25));
    -webkit-box-reflect: below 2px linear-gradient(transparent 58%, rgba(255,255,255,.22));
  }
  #title { left: 182px; top: 40px; margin: 0; display: flex; align-items: baseline; gap: 18px; line-height: 1; }
  #title .g {
    font-family: var(--display); font-weight: 800; font-size: 84px; letter-spacing: 6px;
    background: linear-gradient(180deg, #d8e8ff 0%, #7fb3ff 38%, #2f74ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(60,130,255,.45));
  }
  #title .v {
    font-family: var(--display); font-weight: 300; font-size: 84px; letter-spacing: 2px;
    color: transparent; -webkit-text-stroke: 1.5px rgba(140,185,255,.9);
    filter: drop-shadow(0 0 14px rgba(60,130,255,.4));
  }
  #subtitle { left: 186px; top: 136px; }
  #subtitle b { color: var(--blue); font-weight: 500; }
  #radioactive { left: 50px; top: 186px; width: 104px; text-align: center; }
  #radioactive span {
    display: inline-block; font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 3px; padding-left: 3px;
    color: #ffd84a; text-shadow: 0 0 10px rgba(255,210,60,.55);
    animation: flicker 6s infinite;
  }
  @keyframes flicker { 0%, 91%, 100% { opacity: 1; } 92% { opacity: .3; } 93% { opacity: 1; } 95% { opacity: .45; } 96% { opacity: 1; } }

  /* ---------- specimen ---------- */
  #jarSlot { left: 540px; top: 206px; width: 360px; height: 145px; }
  #jarFrame { left: 494px; top: 176px; width: 452px; height: 236px; }
  #jarFrame .tl { position: absolute; left: 0; bottom: -26px; }
  #jarFrame .br { position: absolute; right: 0; bottom: -26px; color: var(--green); }
  #jarFrame .br::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; margin-right: 8px; vertical-align: 1px; animation: blink 1.4s infinite; }
  #jarFrame .ticks { position: absolute; left: 30px; right: 30px; bottom: 14px; height: 8px;
    background: repeating-linear-gradient(90deg, rgba(160,200,255,.35) 0 1px, transparent 1px 13px); opacity: .8; }
  #platform { left: 540px; top: 350px; width: 360px; height: 40px; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(90,255,160,.22), rgba(90,255,160,0) 70%); filter: blur(6px); }
  @keyframes blink { 50% { opacity: .3; } }

  /* ---------- passcode ---------- */
  #pad { left: 475px; top: 456px; width: 490px; height: 500px; }
  #display {
    position: absolute; left: 0; right: 0; top: 0; height: 112px; border-radius: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; cursor: pointer;
  }
  #display .label { font-family: var(--display); font-size: 24px; font-weight: 500; letter-spacing: 14px; padding-left: 14px; color: var(--text); }
  #dots { display: flex; gap: 26px; }
  #dots i { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.6); transition: all .15s; }
  #dots i.on { background: #fff; border-color: #fff; box-shadow: 0 0 12px rgba(150,200,255,.95); transform: scale(1.12); }
  #dots.bad i { border-color: var(--red); background: var(--red); box-shadow: 0 0 12px var(--red); }
  #dots.bad { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-14px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); } }

  #keys { position: absolute; left: 0; top: 132px; display: grid; grid-template-columns: repeat(4, 112px); grid-template-rows: repeat(3, 112px); gap: 14px; }
  .key {
    position: relative; border-radius: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    opacity: 0; transform: translateY(16px) scale(.94); filter: blur(6px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.2,.9,.25,1.1), filter .8s ease, box-shadow .2s, background .2s;
    transition-delay: calc(.8s + var(--i) * .055s);
  }
  body.ready .key { opacity: 1; transform: none; filter: none; }
  .key b { font-family: var(--display); font-size: 50px; font-weight: 300; line-height: 1; color: #fff; }
  .key small { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; padding-left: 3px; color: var(--muted); height: 13px; }
  .key.down {
    background: linear-gradient(155deg, rgba(255,255,255,.30), rgba(255,255,255,.10));
    border-color: rgba(255,255,255,.45);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 30px rgba(110,170,255,.5);
    transform: scale(.955); transition: none;
  }
  .ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,0) 70%); animation: ripple .6s ease-out forwards; }
  @keyframes ripple { to { transform: scale(14); opacity: 0; } }

  /* ---------- radiation card ---------- */
  #rad { left: 1030px; top: 44px; width: 362px; height: 566px; border-radius: 26px; }
  #rad .head { position: absolute; left: 26px; right: 26px; top: 24px; display: flex; justify-content: space-between; align-items: center; }
  #rad h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; letter-spacing: .5px; color: var(--text); }
  #rad h2 span { font-weight: 400; color: var(--muted); font-size: 22px; margin-left: 4px; }
  #live { color: var(--green); }
  #live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; margin-right: 8px; vertical-align: 1px; animation: blink 1.2s infinite; }
  #readout { position: absolute; left: 26px; top: 80px; display: flex; align-items: baseline; gap: 10px; color: var(--green); font-variant-numeric: tabular-nums; }
  #val { font-family: var(--display); font-size: 58px; font-weight: 600; letter-spacing: -.5px; text-shadow: 0 0 22px rgba(53,240,138,.45); }
  #unit { font-family: var(--mono); font-size: 15px; letter-spacing: 1px; }
  #delta { font-family: var(--mono); font-size: 14px; padding: 4px 9px; border-radius: 999px; background: rgba(53,240,138,.13); border: 1px solid rgba(53,240,138,.3); margin-left: 4px; }
  #chart { position: absolute; left: 0; top: 160px; width: 362px; height: 200px; }
  #rad hr { position: absolute; left: 26px; right: 26px; top: 384px; margin: 0; border: 0; border-top: 1px solid var(--line); }
  #statusLbl { position: absolute; left: 26px; top: 406px; }
  #status { position: absolute; left: 26px; top: 432px; display: flex; align-items: center; gap: 16px; font-family: var(--display); font-size: 44px; font-weight: 600; letter-spacing: 1px; color: var(--green); }
  #status .dot { width: 18px; height: 18px; border-radius: 50%; background: currentColor; box-shadow: 0 0 16px currentColor, 0 0 0 6px rgba(53,240,138,.14); animation: blink 1.8s infinite; }
  #status.high { color: var(--red); }
  #status.high .dot { box-shadow: 0 0 18px currentColor, 0 0 0 6px rgba(255,70,70,.2); animation-duration: .3s; }
  #legend { position: absolute; left: 26px; right: 26px; top: 512px; display: flex; gap: 22px; font-size: 16px; color: rgba(235,242,255,.8); }
  #legend div { display: flex; align-items: center; gap: 9px; }
  #legend i { width: 10px; height: 10px; border-radius: 50%; }

  /* ---------- bottom bar ---------- */
  #bar { left: 50px; right: 48px; bottom: 26px; display: flex; justify-content: space-between; align-items: center; }
  #bar .sep { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); margin: 0 14px; vertical-align: 3px; }
  #bar .ok { color: var(--green); }

  /* ---------- crash ---------- */
  #flash { position: fixed; inset: 0; background: var(--red); opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  body.alarm #flash { animation: alarm .3s steps(2) infinite; }
  @keyframes alarm { 0% { opacity: 0; } 50% { opacity: .26; } }
  body.alarm #stage, body.alarm #jar { animation: jitter .12s steps(2) infinite; }
  @keyframes jitter { 0% { translate: 0 0; } 25% { translate: -6px 3px; } 50% { translate: 5px -4px; } 75% { translate: -3px -2px; } }

  #final { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; opacity: 0; pointer-events: none; text-align: center; gap: 2.5vh; }
  #final.show { opacity: 1; transition: opacity .3s; }
  #wake { font-family: var(--display); font-weight: 800; font-size: 16vh; line-height: .9; letter-spacing: .04em; opacity: 0; }
  #oscar { font-family: var(--display); font-weight: 500; font-size: 6.5vh; letter-spacing: .14em; opacity: 0; }
  #oscar b { font-weight: 800; background: linear-gradient(180deg, #fff3b0, #e9bf4e 45%, #a87a1c);
    -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(233,191,78,.45)); }
  #final.show #wake { animation: glitchIn 1.1s steps(1) forwards, rgb 2.5s 1.1s infinite; }
  #final.show #oscar { animation: rise 1.2s 1.5s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes glitchIn { 0% { opacity: 0; } 10% { opacity: 1; transform: translateX(-12px) skewX(-12deg); } 20% { opacity: 0; }
    32% { opacity: 1; transform: translateX(10px); } 44% { opacity: .2; } 56% { opacity: 1; transform: translateX(-4px) skewX(6deg); } 70%, 100% { opacity: 1; transform: none; } }
  @keyframes rgb { 0%, 86%, 100% { text-shadow: none; transform: none; }
    88% { text-shadow: -6px 0 rgba(255,0,60,.9), 6px 0 rgba(0,220,255,.9); transform: translateX(3px); }
    91% { text-shadow: 5px 0 rgba(255,0,60,.9), -5px 0 rgba(0,220,255,.9); transform: translateX(-3px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); letter-spacing: .4em; } to { opacity: 1; transform: none; letter-spacing: .14em; } }

  #jar { position: fixed; left: 0; top: 0; opacity: 0; transform-origin: 0 0; will-change: transform, opacity; pointer-events: none;
    -webkit-box-reflect: below 0px linear-gradient(transparent 64%, rgba(255,255,255,.2)); }
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" alt="" draggable="false">
<div id="flash"></div>
<div id="final">
  <div id="wake">WAKE UP</div>
  <div id="oscar">ARVINTH WON AN <b>OSCAR</b></div>
</div>

<script>
/* ================= SETTINGS ================= */
const PASSCODE = '6969';
const T = { black: 5.0, fadeIn: 1.0, hold: 1.2, zoomOut: 3.2 };   // intro timing, seconds
const JAR_ASPECT = 2.48307;
/* ============================================ */

const $ = id => document.getElementById(id);
const stage = $('stage'), jar = $('jar'), grid = $('grid'), vig = $('vignette'), sign = $('sign');
const clamp = v => Math.max(0, Math.min(1, v));
const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const lerp = (a, b, k) => a + (b - a) * k;

/* ---------- layout ---------- */
let L, introT = 0, crashed = false, started = false, readyAt = null;
function layout() {
  const W = innerWidth, H = innerHeight;
  const s = Math.min(W / 1440, H / 1000);
  stage.style.transform = `translate(${(W - 1440*s)/2}px, ${(H - 1000*s)/2}px) scale(${s})`;
  const sw = Math.min(W * 0.96, H * 0.92 * JAR_ASPECT);
  const r = $('jarSlot').getBoundingClientRect();
  L = { start: { x: (W - sw)/2, y: (H - sw/JAR_ASPECT)/2, w: sw }, end: { x: r.left, y: r.top, w: r.width } };
  jar.style.width = sw + 'px';
  if (!crashed) renderIntro(introT);
}

/* ---------- intro ---------- */
function renderIntro(t) {
  introT = t;
  const a = T.black, b = a + T.fadeIn, c = b + T.hold, d = c + T.zoomOut;
  const fin = easeOut(clamp((t - a) / T.fadeIn));
  const drift = 1.03 - 0.03 * easeOut(clamp((t - a) / (T.fadeIn + T.hold)));
  const z = ease(clamp((t - c) / T.zoomOut));
  const s = L.start, e = L.end;
  const w = lerp(s.w * drift, e.w, z);
  const cx = lerp(s.x + s.w/2, e.x + e.w/2, z);
  const cy = lerp(s.y + s.w/JAR_ASPECT/2, e.y + e.w/JAR_ASPECT/2, z);
  jar.style.transform = `translate3d(${cx - w/2}px, ${cy - w/JAR_ASPECT/2}px, 0) scale(${w / s.w})`;
  jar.style.opacity = fin;
  const bg = easeOut(clamp((t - (c + T.zoomOut*0.25)) / (T.zoomOut*0.75)));
  grid.style.opacity = bg; vig.style.opacity = bg;
  sign.style.opacity = easeOut(clamp((t - (d - 0.6)) / 1.0));
  if (started && t >= d - 0.3 && !readyAt) { document.body.classList.add('ready'); readyAt = performance.now(); }
}
const introEnd = () => T.black + T.fadeIn + T.hold + T.zoomOut + 1.5;

function start() {
  if (started) return; started = true;
  wakeLock();
  let t0 = null;
  const step = now => {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;
    renderIntro(t);
    if (t < introEnd() && !crashed) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* session clock in the bottom bar */
setInterval(() => {
  if (!readyAt || crashed) return;
  const s = Math.floor((performance.now() - readyAt) / 1000) + 4127;
  const p = n => String(n).padStart(2, '0');
  $('clock').textContent = `${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;
}, 250);

/* ---------- full screen + keep awake ---------- */
function goFullscreen() {
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) return;
  const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn && !(document.fullscreenElement || document.webkitFullscreenElement)) {
    try { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
}
async function wakeLock() { try { await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && started) wakeLock(); });

/* ---------- chart ---------- */
const cv = $('chart'), g = cv.getContext('2d');
let pts = [], chartColor = '#35f08a', level = 0.21;
for (let i = 0; i < 64; i++) { level += (Math.random() - 0.32) * 0.012; pts.push(level); }
$('val').textContent = level.toFixed(2);
setInterval(() => {
  if (crashed) return;
  level += (Math.random() - 0.3) * 0.012;
  pts.push(level); if (pts.length > 64) pts.shift();
  $('val').textContent = level.toFixed(2);
  $('delta').textContent = '▲ ' + Math.max(0.1, (level / pts[0] - 1) * 100).toFixed(1) + '%';
}, 380);
function drawChart() {
  const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  const sc = r.width / cv.offsetWidth || 1;
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  g.clearRect(0, 0, W, H);
  if (W) {
    const u = dpr * sc, padX = 26 * u;
    g.strokeStyle = 'rgba(160,190,255,.08)'; g.lineWidth = 1;
    for (let i = 0; i <= 4; i++) { const y = Math.round(H * i / 4) + .5; g.beginPath(); g.moveTo(padX, y); g.lineTo(W - padX, y); g.stroke(); }
    const mn = Math.min(...pts), mx = Math.max(...pts), pad = (mx - mn) * 0.15 + 0.005;
    const top = H * 0.08, bot = H * 0.96;
    const X = i => padX + (i / (pts.length - 1)) * (W - padX * 2);
    const Y = v => bot - (v - (mn - pad)) / ((mx + pad) - (mn - pad)) * (bot - top);
    const grad = g.createLinearGradient(0, top, 0, H);
    grad.addColorStop(0, chartColor + '50'); grad.addColorStop(1, chartColor + '00');
    g.beginPath(); g.moveTo(X(0), H); pts.forEach((v, i) => g.lineTo(X(i), Y(v))); g.lineTo(X(pts.length - 1), H); g.closePath();
    g.fillStyle = grad; g.fill();
    g.beginPath(); pts.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
    g.strokeStyle = chartColor; g.lineWidth = 2.5 * u; g.lineJoin = 'round'; g.shadowColor = chartColor; g.shadowBlur = 14 * u; g.stroke(); g.shadowBlur = 0;
    const hx = X(pts.length - 1), hy = Y(pts[pts.length - 1]), pulse = (Math.sin(performance.now() / 220) + 1) / 2;
    g.setLineDash([3 * u, 5 * u]); g.strokeStyle = chartColor + '66'; g.lineWidth = 1 * u;
    g.beginPath(); g.moveTo(padX, hy); g.lineTo(hx, hy); g.stroke(); g.setLineDash([]);
    g.beginPath(); g.arc(hx, hy, (6 + pulse * 7) * u, 0, 7); g.fillStyle = chartColor + '40'; g.fill();
    g.beginPath(); g.arc(hx, hy, 4.5 * u, 0, 7); g.fillStyle = chartColor; g.fill();
  }
  requestAnimationFrame(drawChart);
}
requestAnimationFrame(drawChart);

/* ---------- keypad ---------- */
let code = '', locked = false;
const dots = $('dots');
function paintDots() { [...dots.children].forEach((d, i) => d.classList.toggle('on', i < code.length)); }
document.querySelectorAll('.key').forEach(k => {
  k.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    if (!readyAt || locked || crashed) return;
    k.classList.add('down'); setTimeout(() => k.classList.remove('down'), 160);
    const r = k.getBoundingClientRect(), sc = r.width / k.offsetWidth;
    const rp = document.createElement('span'); rp.className = 'ripple';
    rp.style.left = (ev.clientX ? (ev.clientX - r.left) / sc : k.offsetWidth / 2) + 'px';
    rp.style.top = (ev.clientY ? (ev.clientY - r.top) / sc : k.offsetHeight / 2) + 'px';
    k.appendChild(rp); setTimeout(() => rp.remove(), 650);
    code += k.dataset.k; paintDots();
    if (code.length === 4) {
      locked = true;
      if (code === PASSCODE) setTimeout(crash, 250);
      else setTimeout(() => {
        dots.classList.add('bad');
        setTimeout(() => { dots.classList.remove('bad'); code = ''; paintDots(); locked = false; }, 650);
      }, 200);
    }
  });
});
$('display').addEventListener('pointerdown', () => { if (!locked) { code = ''; paintDots(); } });

/* ---------- crash ---------- */
function crash() {
  crashed = true;
  [...dots.children].forEach(d => { d.style.background = 'var(--red)'; d.style.borderColor = 'var(--red)'; d.style.boxShadow = '0 0 12px var(--red)'; });
  chartColor = '#ff4646';
  $('readout').style.color = 'var(--red)'; $('val').style.textShadow = '0 0 22px rgba(255,70,70,.6)';
  $('delta').style.background = 'rgba(255,70,70,.15)'; $('delta').style.borderColor = 'rgba(255,70,70,.4)';
  $('live').style.color = 'var(--red)'; $('live').textContent = 'Breach';
  $('status').classList.add('high'); $('statusText').textContent = 'HIGH';
  const br = document.querySelector('#jarFrame .br'); br.style.color = 'var(--red)'; br.textContent = 'Breach';
  let n = 0;
  const spike = setInterval(() => {
    level += 0.4 + Math.random() * 0.9; pts.push(level); pts.shift();
    $('val').textContent = level.toFixed(2);
    $('delta').textContent = '▲ ' + ((level / pts[0] - 1) * 100).toFixed(0) + '%';
    if (++n > 14) clearInterval(spike);
  }, 80);
  document.body.classList.add('alarm');

  setTimeout(() => {
    document.body.classList.remove('alarm');
    const pieces = [
      ...document.querySelectorAll('.key'), $('display'),
      $('rad'), $('bar'), $('jarFrame'), $('platform'),
      $('title'), $('subtitle'), $('radioactive'), sign
    ];
    pieces.forEach(el => {
      const cs = getComputedStyle(el).transform, base = cs === 'none' ? '' : cs + ' ';
      const rot = (Math.random() * 2 - 1) * 55, dx = (Math.random() * 2 - 1) * 120;
      el.style.transition = 'none';
      el.animate([
        { transform: base + 'translate(0,0) rotate(0deg)' },
        { transform: base + `translate(${dx * .15}px,-18px) rotate(${rot * .05}deg)`, offset: .12 },
        { transform: base + `translate(${dx}px,1500px) rotate(${rot}deg)` }
      ], { duration: 1100 + Math.random() * 500, delay: Math.random() * 650, easing: 'cubic-bezier(.5,0,.95,.6)', fill: 'forwards' });
    });
    const k = parseFloat(jar.style.transform.match(/scale\(([\d.]+)\)/)[1]), jt = jar.style.transform;
    jar.animate([
      { transform: jt },
      { transform: jt + ` translate(0px, ${-30 / k}px) rotate(-4deg)`, offset: .15 },
      { transform: jt + ` translate(${80 / k}px, ${innerHeight * 1.6 / k}px) rotate(28deg)` }
    ], { duration: 1500, delay: 700, easing: 'cubic-bezier(.5,0,.95,.6)', fill: 'forwards' });
    document.querySelectorAll('.light').forEach(b => { b.style.transition = 'opacity .6s'; b.style.opacity = 0; });
    setTimeout(() => {
      grid.animate([{ opacity: 1 }, { opacity: .2 }, { opacity: .8 }, { opacity: 0 }, { opacity: .4 }, { opacity: 0 }], { duration: 700, easing: 'steps(6)', fill: 'forwards' });
      vig.style.opacity = 0;
    }, 1400);
    setTimeout(() => $('final').classList.add('show'), 2600);
  }, 1300);
}

/* ---------- controls ---------- */
// Tap the black screen to begin (also asks Safari for full screen).
addEventListener('pointerdown', () => { if (!started) { goFullscreen(); start(); } });
// Reset: triple-tap the bottom-left corner, or press R.
let taps = [];
addEventListener('pointerdown', ev => {
  if (ev.clientX > innerWidth * 0.12 || ev.clientY < innerHeight * 0.88) return;
  const now = Date.now(); taps = taps.filter(x => now - x < 900); taps.push(now);
  if (taps.length >= 3) location.reload();
});
addEventListener('keydown', ev => {
  if (ev.key === 'r' || ev.key === 'R') location.reload();
  if (/^[0-9]$/.test(ev.key)) document.querySelector(`.key[data-k="${ev.key}"]`)?.dispatchEvent(new PointerEvent('pointerdown'));
});
addEventListener('gesturestart', ev => ev.preventDefault());
addEventListener('resize', layout);
document.addEventListener('fullscreenchange', layout);
document.addEventListener('webkitfullscreenchange', layout);
window.__render = t => renderIntro(t);

layout();
if (new URLSearchParams(location.search).has('auto')) start();
</script>
